<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Setup - ONE TIME ONLY</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #ff6b6b; }
    .success { color: #51cf66; }
    .error { color: #ff6b6b; }
    .warning { color: #ffd43b; }
    .info { color: #74c0fc; }
    #log {
      background: #000;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      min-height: 400px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🔥 PRODUCTION SETUP - ONE TIME ONLY</h1>
  <p class="warning">⚠️ Запусти ОДИН РАЗ для настройки админов</p>
  <p class="info">После выполнения этот файл можно удалить!</p>
  
  <div id="log"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js';

const firebaseConfig = {
  apiKey: "AIzaSyBpNDja80x7MtlE7851R36zdOoqcNwC-Fk",
  authDomain: "coffeeaddict-c9d70.firebaseapp.com",
  projectId: "coffeeaddict-c9d70",
  storageBucket: "coffeeaddict-c9d70.appspot.com",
  messagingSenderId: "148979196662",
  appId: "1:148979196662:web:ef1b3fe13f80e5645b82d7"
};

const VAPID_KEY = 'BKPPcrrCt_ZQW8zIuxACO86IxEMQ8aOWKuJFeqONaI6eSyh8zVAdebf0TM_fGylIRjmnPDyiDwpuq5kC5bNNKmU';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const messaging = getMessaging(app);

const logDiv = document.getElementById('log');

function log(message, type = 'info') {
  const colors = {
    success: 'success',
    error: 'error',
    warning: 'warning',
    info: 'info'
  };
  logDiv.innerHTML += `<div class="${colors[type]}">${message}</div>`;
  logDiv.scrollTop = logDiv.scrollHeight;
  console.log(message);
}

async function oneTimeSetup() {
  log('🔥 PRODUCTION SETUP - ЗАПУСКАЕТСЯ ОДИН РАЗ', 'warning');
  log('================================================\n', 'info');

  // Админские учётки
  const admins = [
    { email: 'admin@mail.com', uid: 'MswmRmPTBzegI9aex6esxSomUL92' },
    { email: 'admin121@gmail.com', uid: null }, // найдём автоматически
    { email: 'barista121@gmail.com', uid: null }
  ];

  for (const admin of admins) {
    try {
      log(`\n📝 Настройка: ${admin.email}`, 'info');
      
      // Если нет uid, пропускаем (найдём позже)
      if (!admin.uid) {
        log('⚠️ UID не указан, пропускаю (настрой вручную)', 'warning');
        continue;
      }

      // Устанавливаем роль админа В FIRESTORE НАПРЯМУЮ
      log('🔧 Устанавливаю role: admin...', 'info');
      await setDoc(doc(db, 'users', admin.uid), {
        role: 'admin',
        email: admin.email,
        updatedAt: new Date()
      }, { merge: true });
      
      log(`✅ ${admin.email} - role: admin установлена!`, 'success');
      
    } catch (error) {
      log(`❌ Ошибка для ${admin.email}: ${error.message}`, 'error');
    }
  }

  log('\n================================================', 'info');
  log('🎉 PRODUCTION SETUP ЗАВЕРШЁН!', 'success');
  log('================================================\n', 'info');
  log('✅ Админы настроены в Firestore', 'success');
  log('✅ Теперь при входе в приложение:', 'info');
  log('   1. Админ залогинится', 'info');
  log('   2. Увидит модалку "Включить уведомления"', 'info');
  log('   3. Включит уведомления', 'info');
  log('   4. FCM токен сохранится автоматически', 'info');
  log('   5. Всё работает!', 'success');
  log('\n📝 Этот скрипт больше НЕ НУЖНО запускать!', 'warning');
  log('   Можно удалить после проверки.\n', 'warning');
}

// Запускаем АВТОМАТИЧЕСКИ при загрузке
window.addEventListener('load', () => {
  oneTimeSetup().catch(err => log('❌ Критическая ошибка: ' + err.message, 'error'));
});
  </script>
</body>
</html>
