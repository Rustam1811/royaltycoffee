workflows:

  # ─────────────────────────────────────────────────────────────
  # Android Release → Google Play (Internal Track)
  # ─────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (AAB → Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      java: 21
      node: 22
      groups:
        - google_play          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - android_signing      # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        - firebase             # VITE_FIREBASE_API_KEY, etc.
      vars:
        PACKAGE_NAME: "com.royalcoffee.app"
        GOOGLE_PLAY_TRACK: production

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/android/.gradle

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets (all sub-apps)
        script: npm run cap:build:android

      - name: Set up Android keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/release.jks
          cat >> $CM_BUILD_DIR/android/signing.properties << EOF
          storeFile=release.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Build Android AAB (release)
        script: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$PROJECT_BUILD_NUMBER \
            --no-daemon \
            --stacktrace

      - name: Verify AAB exists
        script: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB not found at $AAB"
            exit 1
          fi
          echo "AAB size: $(du -sh $AAB | cut -f1)"

    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
      - android/build/reports/**

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # Android Debug → artifact only (PR / feature branch)
  # ─────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug Build (APK)
    max_build_duration: 30
    instance_type: mac_mini_m2

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true

    environment:
      java: 21
      node: 22
      groups:
        - firebase
      vars:
        PACKAGE_NAME: "com.royalcoffee.app"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run cap:build:android

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # iOS Release → TestFlight / App Store (MANUAL signing)
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (IPA → TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Royalty Coffee

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      xcode: latest
      node: 22
      groups:
        - ios_signing            # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE
        - firebase               # VITE_FIREBASE_* keys
      vars:
        BUNDLE_ID: "com.royalcoffee.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        TEAM_ID: "X63R22FAMX"
        PROFILE_NAME: "Royal Coffee AppStore"
        CERT_IDENTITY: "Apple Distribution"
        EXPORT_OPTIONS_PLIST: "ios/ExportOptions.plist"
        VITE_API_BASE: /api

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install Node dependencies
        script: |
          npm ci
          cd admin && npm ci
          cd ../workshop && npm ci || true
          cd ../landing && npm ci || true

      - name: Build web assets
        script: npm run cap:build:ios

      - name: Install signing certificate (manual)
        script: |
          set -e
          # Init clean keychain
          keychain initialize

          # Decode .p12 and import into keychain
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

          # Decode .mobileprovision and install
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/profile.mobileprovision"

          # Extract UUID and copy with UUID name (Xcode expects this)
          PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$PROFILE_DIR/profile.mobileprovision" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
          echo "Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV

      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build IPA (manual signing)
        script: |
          set -e
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            COMPILER_INDEX_STORE_ENABLE=NO

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/$EXPORT_OPTIONS_PLIST"

    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # iOS Debug → IPA artifact only (PR / feature branch)
  # ─────────────────────────────────────────────────────────────
  ios-debug:
    name: iOS Debug Build (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Royalty Coffee

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true

    environment:
      xcode: latest
      node: 22
      groups:
        - firebase               # VITE_FIREBASE_* keys
      vars:
        BUNDLE_ID: "com.royalcoffee.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        VITE_API_BASE: /api

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install Node dependencies
        script: |
          npm ci
          cd admin && npm ci
          cd ../workshop && npm ci || true
          cd ../landing && npm ci || true

      - name: Build web assets
        script: npm run cap:build:ios

      - name: Set up code signing (development)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_DEVELOPMENT \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA (debug)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Debug

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true
