workflows:

  # ─────────────────────────────────────────────
  # Android — Release AAB → Google Play
  # ─────────────────────────────────────────────
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Add these variables in Codemagic UI → App settings → Environment variables:
      # KEYSTORE_FILE (base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # GOOGLE_SERVICES_JSON (base64), GPLAY_SERVICE_ACCOUNT_JSON
      # VITE_* env vars
      vars:
        PACKAGE_NAME: "com.royalcoffee.app"
      node: 22
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: repo
          include: true

    scripts:
      - name: Set up Google Services JSON
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json

      - name: Set up signing keystore
        script: |
          echo $KEYSTORE_FILE | base64 --decode > android/release.jks
          cat >> android/signing.properties << EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install root dependencies
        script: npm ci --legacy-peer-deps

      - name: Install admin dependencies
        script: cd admin && npm ci --legacy-peer-deps

      - name: Install workshop dependencies
        script: cd workshop && npm ci --legacy-peer-deps

      - name: Build web assets (Capacitor mode)
        script: |
          export CAPACITOR_BUILD=true
          npm run build:all
          node scripts/copy-workshop-to-app.mjs

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GPLAY_SERVICE_ACCOUNT_JSON
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # iOS — Release IPA → App Store Connect
  # ─────────────────────────────────────────────
  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      # Add these variables in Codemagic UI → App settings → Environment variables:
      # CM_CERTIFICATE (base64), CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE (base64)
      # GOOGLE_SERVICES_PLIST (base64)
      # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      # VITE_* env vars
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: "com.royalcoffee.app"
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: repo
          include: true

    scripts:
      - name: Set up GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICES_PLIST | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Install root dependencies
        script: npm ci --legacy-peer-deps

      - name: Install admin dependencies
        script: cd admin && npm ci --legacy-peer-deps

      - name: Install workshop dependencies
        script: cd workshop && npm ci --legacy-peer-deps

      - name: Build web assets (Capacitor mode)
        script: |
          export CAPACITOR_BUILD=true
          npm run build:all
          node scripts/copy-workshop-to-app.mjs

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set up code signing (use existing profile from Apple Developer)
        script: |
          keychain initialize

          # Fetch БЕЗ --create: тянем существующий рабочий профиль,
          # который уже настроен правильно (Sign In with Apple и т.д.)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS

          keychain add-certificates
          xcode-project use-profiles

      - name: Bump build number (avoid App Store duplicate)
        script: |
          cd $CM_BUILD_DIR/ios/App
          # Используем номер сборки Codemagic + большой offset, чтобы точно был выше предыдущих
          NEW_BUILD_NUMBER=$(($BUILD_NUMBER + 100))
          echo "Setting build number to: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build iOS release IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # Firebase Hosting — Web only deploy
  # ─────────────────────────────────────────────
  web-deploy:
    name: Firebase Hosting Deploy
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      # Add these variables in Codemagic UI → App settings → Environment variables:
      # FIREBASE_TOKEN, VITE_* env vars
      node: 22

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps
          cd admin && npm ci --legacy-peer-deps
          cd ../workshop && npm ci --legacy-peer-deps

      - name: Build all web apps
        script: npm run build:all

      - name: Deploy to Firebase Hosting
        script: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

    artifacts:
      - dist/**

    publishing:
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true
