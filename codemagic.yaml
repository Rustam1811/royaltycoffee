workflows:

  # ─────────────────────────────────────────────
  # Android — Release AAB → Google Play
  # ─────────────────────────────────────────────
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Add these variables in Codemagic UI → App settings → Environment variables:
      # KEYSTORE_FILE (base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # GOOGLE_SERVICES_JSON (base64), GPLAY_SERVICE_ACCOUNT_JSON
      # VITE_* env vars
      groups:
        - api
        - app_id
        - auth_domain
        - measurement_id
        - project_id
        - sender_id
        - storage_bucket
      vars:
        PACKAGE_NAME: "com.royalcoffee.app"
      node: 22
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: repo
          include: true

    scripts:
      - name: Set up Google Services JSON
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json

      - name: Set up signing keystore
        script: |
          echo $KEYSTORE_FILE | base64 --decode > android/release.jks
          cat >> android/signing.properties << EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install root dependencies
        script: npm ci --legacy-peer-deps

      - name: Install admin dependencies
        script: cd admin && npm ci --legacy-peer-deps

      - name: Install workshop dependencies
        script: cd workshop && npm ci --legacy-peer-deps

      - name: Build web assets (Capacitor mode)
        script: |
          export CAPACITOR_BUILD=true
          npm run build:all
          node scripts/copy-workshop-to-app.mjs

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GPLAY_SERVICE_ACCOUNT_JSON
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # iOS — Release IPA → App Store Connect
  # ─────────────────────────────────────────────
  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      # Add these variables in Codemagic UI → App settings → Environment variables:
      # CM_CERTIFICATE (base64), CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE (base64)
      # GOOGLE_SERVICES_PLIST (base64)
      # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      # VITE_* env vars
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: "com.royalcoffee.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "T5QGVHH94U"
        APP_STORE_CONNECT_ISSUER_ID: "0a63e59d-a55d-4041-b332-01b08d787958"
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: repo
          include: true

    scripts:
      - name: Install root dependencies
        script: npm ci --legacy-peer-deps

      - name: Install admin dependencies
        script: cd admin && npm ci --legacy-peer-deps

      - name: Install workshop dependencies
        script: cd workshop && npm ci --legacy-peer-deps

      - name: Build web assets (Capacitor mode)
        script: |
          export CAPACITOR_BUILD=true
          npm run build:all
          node scripts/copy-workshop-to-app.mjs

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set up code signing (manual with provided cert + profile)
        script: |
          set -e
          keychain initialize

          echo "=== Decoding distribution certificate ==="
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12

          echo "=== Decoding provisioning profile ==="
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/royal_coffee.mobileprovision"

          echo "=== Adding certificate to keychain ==="
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

          echo "=== Applying provisioning profile to Xcode project ==="
          xcode-project use-profiles

      - name: Bump build number (avoid App Store duplicate)
        script: |
          cd $CM_BUILD_DIR/ios/App
          # Используем номер сборки Codemagic + большой offset, чтобы точно был выше предыдущих
          NEW_BUILD_NUMBER=$(($BUILD_NUMBER + 100))
          echo "Setting build number to: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build iOS release IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        script: |
          # Декодируем ключ из base64 чтобы сохранить переносы строк
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode > /tmp/auth_key.p8

          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa')" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/auth_key.p8 \
            --testflight

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # Firebase Hosting — Web only deploy
  # ─────────────────────────────────────────────
  web-deploy:
    name: Firebase Hosting Deploy
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      # Add these variables in Codemagic UI → App settings → Environment variables:
      # FIREBASE_TOKEN, VITE_* env vars
      node: 22

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps
          cd admin && npm ci --legacy-peer-deps
          cd ../workshop && npm ci --legacy-peer-deps

      - name: Build all web apps
        script: npm run build:all

      - name: Deploy to Firebase Hosting
        script: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

    artifacts:
      - dist/**

    publishing:
      email:
        recipients:
          - manarbekov18999@gmail.com
        notify:
          success: true
          failure: true
