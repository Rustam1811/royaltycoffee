apply plugin: 'com.android.application'

android {
    namespace = "com.royalcoffee.app"
    compileSdk = rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.royalcoffee.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        
        versionCode 44
        versionName "1.8.10"
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Убираю archivesBaseName, чтобы вернуться к стандартному имени app-release.aab
    // Это поможет избежать путаницы со старыми файлами "RoyalCoffee"

    signingConfigs {
        release {
            def signingPropsFile = rootProject.file("signing.properties")
            if (signingPropsFile.exists()) {
                def signingProps = new Properties()
                signingProps.load(new FileInputStream(signingPropsFile))
                storeFile = rootProject.file(signingProps['storeFile'])
                storePassword = signingProps['storePassword']
                keyAlias = signingProps['keyAlias']
                keyPassword = signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

// Собирает сразу APK + AAB одной командой: ./gradlew buildRelease
task buildRelease {
    dependsOn 'assembleRelease', 'bundleRelease'
    group = 'build'
    description = 'Build both release APK and AAB'
}

task createReleaseKeystore(type: Exec) {
    description 'Generates a release keystore file using the project JDK'
    workingDir rootProject.projectDir
    
    def keystoreFile = rootProject.file("release.jks")
    if (!keystoreFile.exists()) {
        def keytoolPath = "${System.getProperty('java.home')}/bin/keytool"
        commandLine keytoolPath, "-genkey", "-v",
                "-keystore", "release.jks",
                "-alias", "my-key-alias",
                "-keyalg", "RSA",
                "-keysize", "2048",
                "-validity", "10000",
                "-storepass", "blood123",
                "-keypass", "blood123",
                "-dname", "CN=Royal Coffee, OU=Dev, O=Royal Coffee, L=Almaty, S=KZ, C=KZ"
    } else {
        commandLine "echo", "Keystore already exists."
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
