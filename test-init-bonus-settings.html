<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Init Bonus Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>🎯 Инициализация настроек бонусной системы</h1>
    <p>Создаст документ <code>bonusSettings/default</code> в Firestore с базовыми настройками.</p>
    
    <button onclick="initBonusSettings()">Создать настройки бонусов</button>
    <button onclick="checkSettings()">Проверить текущие настройки</button>
    
    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:3001/api';

        const defaultSettings = {
            baseRate: 5, // 5% базовый процент начисления
            pointsPerRuble: 1,
            minOrderForBonus: 200,
            multipliers: {
                weekend: 2.0,   // x2 в выходные
                morning: 1.5,   // x1.5 утром
                evening: 1.2,   // x1.2 вечером
                vip: 1.5        // x1.5 для VIP
            },
            categories: {
                coffee: { multiplier: 1.2, name: "Кофе" },
                desserts: { multiplier: 1.1, name: "Десерты" },
                breakfast: { multiplier: 1.3, name: "Завтраки" }
            },
            rewards: [
                { 
                    id: "coffee_free", 
                    points: 100, 
                    reward: "Бесплатный кофе", 
                    description: "Любой кофе на выбор",
                    discount: 500,
                    type: "fixed",
                    isActive: true 
                },
                { 
                    id: "discount_10", 
                    points: 500, 
                    reward: "Скидка 10%", 
                    description: "На весь заказ",
                    discount: 10,
                    type: "percentage",
                    isActive: true 
                },
                { 
                    id: "dessert_free", 
                    points: 1000, 
                    reward: "Бесплатный десерт", 
                    description: "Любой десерт на выбор",
                    discount: 800,
                    type: "fixed",
                    category: "desserts",
                    isActive: true 
                }
            ],
            levels: [
                { 
                    level: 1, 
                    name: "Новичок", 
                    minPoints: 0, 
                    benefits: "Базовые бонусы",
                    bonusMultiplier: 1.0
                },
                { 
                    level: 2, 
                    name: "Любитель", 
                    minPoints: 500, 
                    benefits: "x1.2 бонусы",
                    bonusMultiplier: 1.2
                },
                { 
                    level: 3, 
                    name: "Эксперт", 
                    minPoints: 1500, 
                    benefits: "x1.5 бонусы + раннее уведомление",
                    bonusMultiplier: 1.5
                },
                { 
                    level: 4, 
                    name: "VIP", 
                    minPoints: 2000, 
                    benefits: "x2 бонусы + приоритет",
                    bonusMultiplier: 2.0
                }
            ]
        };

        async function initBonusSettings() {
            const result = document.getElementById('result');
            result.className = 'info';
            result.textContent = '⏳ Создание настроек бонусной системы...';

            try {
                console.log('📤 Отправка настроек:', defaultSettings);
                
                const response = await fetch(`${API_BASE}/bonus?action=settings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(defaultSettings)
                });

                const data = await response.json();
                console.log('📥 Ответ сервера:', data);

                if (response.ok) {
                    result.className = 'success';
                    result.textContent = '✅ Настройки бонусов успешно созданы!\n\n' +
                        `Базовый процент: ${defaultSettings.baseRate}%\n` +
                        `Множители: ${JSON.stringify(defaultSettings.multipliers, null, 2)}\n\n` +
                        `Уровни: ${defaultSettings.levels.length} шт.\n` +
                        `Награды: ${defaultSettings.rewards.length} шт.`;
                } else {
                    throw new Error(data.error || 'Ошибка сервера');
                }
            } catch (error) {
                console.error('❌ Ошибка:', error);
                result.className = 'error';
                result.textContent = '❌ Ошибка создания настроек:\n' + error.message;
            }
        }

        async function checkSettings() {
            const result = document.getElementById('result');
            result.className = 'info';
            result.textContent = '⏳ Загрузка текущих настроек...';

            try {
                const response = await fetch(`${API_BASE}/bonus?action=settings`);
                const data = await response.json();
                console.log('📥 Текущие настройки:', data);

                if (response.ok) {
                    result.className = 'success';
                    result.textContent = '✅ Текущие настройки бонусов:\n\n' +
                        JSON.stringify(data, null, 2);
                } else {
                    throw new Error(data.error || 'Ошибка сервера');
                }
            } catch (error) {
                console.error('❌ Ошибка:', error);
                result.className = 'error';
                result.textContent = '❌ Ошибка загрузки настроек:\n' + error.message;
            }
        }

        // Авто-проверка при загрузке страницы
        window.addEventListener('load', () => {
            console.log('🚀 Страница загружена');
            console.log('API_BASE:', API_BASE);
        });
    </script>
</body>
</html>
