<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Promotions API</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #1a1a1a; }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover { background: #1d4ed8; }
        button.success { background: #10b981; }
        button.success:hover { background: #059669; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .status { padding: 8px; border-radius: 4px; margin-bottom: 12px; }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.info { background: #dbeafe; color: #1e40af; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .promo-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            background: #f9fafb;
        }
        .promo-card h3 { margin-top: 0; color: #1a1a1a; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .badge.active { background: #d1fae5; color: #065f46; }
        .badge.inactive { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Test Promotions API</h1>
        
        <div id="status"></div>
        
        <h2>Действия</h2>
        <button onclick="fetchPromotions()">📋 Получить акции</button>
        <button onclick="createTestPromotion()" class="success">➕ Создать тестовую акцию</button>
        <button onclick="createMultiplePromotions()" class="success">➕➕ Создать несколько акций</button>
        <button onclick="clearResults()">🗑️ Очистить результаты</button>
    </div>

    <div class="container">
        <h2>Результаты</h2>
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = '/api';
        
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = message;
            setTimeout(() => {
                status.innerHTML = '';
                status.className = 'status';
            }, 5000);
        }
        
        function showResults(data) {
            const results = document.getElementById('results');
            
            if (data.promotions && Array.isArray(data.promotions)) {
                const promotions = data.promotions;
                results.innerHTML = `
                    <p><strong>Найдено акций:</strong> ${promotions.length}</p>
                    <div class="grid">
                        ${promotions.map(p => `
                            <div class="promo-card">
                                <h3>${p.title || 'Без названия'}</h3>
                                <p>${p.description || ''}</p>
                                <div>
                                    <span class="badge ${p.isActive ? 'active' : 'inactive'}">
                                        ${p.isActive ? '✓ Активна' : '✗ Неактивна'}
                                    </span>
                                    <span class="badge">${p.discountType === 'percentage' ? p.discountValue + '%' : p.discountValue + ' ₸'}</span>
                                    <span class="badge">${p.category || 'all'}</span>
                                </div>
                                <p style="font-size: 12px; color: #6b7280; margin-top: 8px;">
                                    <strong>Период:</strong> ${new Date(p.startDate).toLocaleDateString('ru-RU')} - ${new Date(p.endDate).toLocaleDateString('ru-RU')}<br>
                                    <strong>Мин. сумма:</strong> ${p.minOrderAmount || 0} ₸<br>
                                    <strong>ID:</strong> ${p.id}
                                </p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                results.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
        }
        
        async function fetchPromotions() {
            try {
                showStatus('🔄 Загрузка акций...', 'info');
                const response = await fetch(`${API_BASE}/promo?action=promotions`);
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('✅ Акции успешно загружены!', 'success');
                    showResults(data);
                    console.log('Promotions:', data);
                } else {
                    showStatus('❌ Ошибка: ' + (data.error || 'Unknown error'), 'error');
                    showResults(data);
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        async function createTestPromotion() {
            const testPromo = {
                title: "Тестовая акция " + Date.now(),
                description: "Скидка 20% на все напитки в течение часа",
                discountType: "percentage",
                discountValue: 20,
                startDate: new Date().toISOString().split('T')[0],
                endDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                category: "all",
                minOrderAmount: 500,
                targetAudience: "all_users",
                isActive: true,
                image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400"
            };
            
            try {
                showStatus('🔄 Создание тестовой акции...', 'info');
                const response = await fetch(`${API_BASE}/promo?action=promotions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testPromo)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('✅ Акция успешно создана!', 'success');
                    showResults(data);
                    // Обновляем список
                    setTimeout(() => fetchPromotions(), 1000);
                } else {
                    showStatus('❌ Ошибка создания: ' + (data.error || 'Unknown error'), 'error');
                    showResults(data);
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        async function createMultiplePromotions() {
            const promotions = [
                {
                    title: "Happy Hour - Утренний кофе",
                    description: "Скидка 25% на все кофейные напитки с 7:00 до 10:00",
                    discountType: "percentage",
                    discountValue: 25,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    category: "coffee",
                    minOrderAmount: 300,
                    targetAudience: "all_users",
                    isActive: true,
                    image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400"
                },
                {
                    title: "Сладкая пятница",
                    description: "При покупке любого десерта - капучино в подарок",
                    discountType: "fixed",
                    discountValue: 500,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    category: "desserts",
                    minOrderAmount: 800,
                    targetAudience: "all_users",
                    isActive: true,
                    image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400"
                },
                {
                    title: "Бонус выходного дня",
                    description: "Двойные бонусы за каждый заказ в выходные дни",
                    discountType: "percentage",
                    discountValue: 15,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    category: "all",
                    minOrderAmount: 0,
                    targetAudience: "all_users",
                    isActive: true,
                    image: "https://images.unsplash.com/photo-1511920170033-f8396924c348?w=400"
                }
            ];
            
            try {
                showStatus('🔄 Создание нескольких акций...', 'info');
                let created = 0;
                
                for (const promo of promotions) {
                    const response = await fetch(`${API_BASE}/promo?action=promotions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(promo)
                    });
                    
                    if (response.ok) {
                        created++;
                    }
                    
                    // Небольшая задержка между запросами
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                showStatus(`✅ Создано акций: ${created} из ${promotions.length}`, 'success');
                // Обновляем список
                setTimeout(() => fetchPromotions(), 1000);
            } catch (error) {
                showStatus('❌ Ошибка: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            showStatus('🗑️ Результаты очищены', 'info');
        }
        
        // Автоматически загружаем акции при открытии страницы
        window.addEventListener('load', () => {
            fetchPromotions();
        });
    </script>
</body>
</html>
